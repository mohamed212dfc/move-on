<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <h1 class="text-2xl font-bold mb-6">سجل الرحلات</h1>
    <div id="trips-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        </div>

    <script>
        fetch('/api/trips')
            .then(res => res.json())
            .then(result => {
                const container = document.getElementById('trips-container');
                result.data.forEach(trip => {
                    container.innerHTML += `
                        <div class="bg-white p-6 rounded-lg shadow-lg border-r-4 border-blue-500">
                            <h2 class="text-xl font-bold text-gray-800">رحلة رقم: ${trip.trip_number}</h2>
                            <p class="text-gray-600">المطعم: ${trip.restaurant_name}</p>
                            <div class="mt-4 border-t pt-4">
                                <p class="text-sm">الحالة: <span class="font-semibold text-blue-600">${trip.trip_state}</span></p>
                                <p class="text-sm">إجمالي السعر: ${trip.total_price} ج.م</p>
                                <p class="text-sm">رسوم التوصيل: ${trip.total_delivery_fee} ج.م</p>
                                <p class="text-xs text-gray-400 mt-2">وقت البدء: ${trip.start_time}</p>
                            </div>
                        </div>
                    `;
                });
            });
    </script>
</body>
</html>
